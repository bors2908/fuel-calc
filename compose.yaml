name: fuel-calc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuel_calc}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_calc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    image: fuel-calc-backend:local
    build:
      context: .
      dockerfile: docker/fuel-calc/backend.Dockerfile
      target: backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fuel_calc}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_calc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: "8080"
      RUSTATA_TOKEN: ${RUSTATA_TOKEN:-}
      BENZUP_TOKEN: ${BENZUP_TOKEN:-}
      IMPORTS_ENABLED: ${IMPORTS_ENABLED:-true}
      FETCH_ON_STARTUP: ${FETCH_ON_STARTUP:-true}
      OKATO_ENDPOINT: ${OKATO_ENDPOINT:-https://showdata.rosstat.gov.ru/backbone/set/13032}
      REGION_SELECTION_ENDPOINT: ${REGION_SELECTION_ENDPOINT:-https://showdata.rosstat.gov.ru/backbone/set/304297}
      REGION_CATALOG_CRON: ${REGION_CATALOG_CRON:-0 0 3 * * MON}
      ROSSTAT_BASE_URL: ${ROSSTAT_BASE_URL:-https://showdata.rosstat.gov.ru}
      ROSSTAT_START_DATE: ${ROSSTAT_START_DATE:-2023-01-01}
      ROSSTAT_CRON: ${ROSSTAT_CRON:-0 0 0 * * *}
      ROSSTAT_IGNORE_TLS_ERRORS: ${ROSSTAT_IGNORE_TLS_ERRORS:-true}
      RUSTATA_BASE_URL: ${RUSTATA_BASE_URL:-https://rustata.ru}
      RUSTATA_START_DATE: ${RUSTATA_START_DATE:-2023-01-01}
      BENZUP_START_DATE: ${BENZUP_START_DATE:-2026-01-01}
      BENZUP_TEST_BACKFILL_ENABLED: ${BENZUP_TEST_BACKFILL_ENABLED:-false}
      BENZUP_CRON: ${BENZUP_CRON:-0 0 12 * * *}
      BENZUP_ENDPOINT: ${BENZUP_ENDPOINT:-https://api.omt-consult.ru/index/regional}
      IMPORTS_TIME_ZONE: ${IMPORTS_TIME_ZONE:-Europe/Moscow}
      SOURCE_CONNECT_TIMEOUT: ${SOURCE_CONNECT_TIMEOUT:-PT10S}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    image: fuel-calc-frontend:local
    build:
      context: .
      dockerfile: docker/fuel-calc/frontend.Dockerfile
      target: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
