openapi: 3.0.1

info:
  title: Fuel Calc API
  description: |-
    REST API MVP сравнения цен и расчёта стоимости заправки. OFFICIAL — недельные данные Росстата с резервом rustata; MARKET — дневные индексы BenzUp.

    Коды регионов берутся из GET /api/v1/regions и передаются строками без преобразования. Массивы query передаются одним CSV-параметром без пробелов; в JSON — обычными массивами. Объём передаётся десятичной строкой, например "600".
  version: 0.6.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: /

paths:
  ###########################################################################
  # Reference Data
  ###########################################################################
  /api/v1/regions:
    get:
      tags:
        - Reference data
      operationId: listRegions
      summary: List regions
      description: "Возвращает территории с хотя бы одним сохранённым наблюдением любого источника, топлива и даты: okatoCode и name.
        includeEmptyRegions=true включает также территории без данных. Сортировка по имени, затем ОКАТО. Каталог обновляется на старте и раз
        в неделю, неизменившаяся выдача не перезаписывается."
      parameters:
        - name: includeEmptyRegions
          in: query
          description: Включить территории без сохранённых наблюдений.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionList"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  #--------------------------------------------------------------------------
  /api/v1/fuel-types:
    get:
      tags:
        - Reference data
      operationId: listFuelTypes
      summary: List fuel types
      description: Возвращает код enum и название поддерживаемого топлива. Коды внешних справочников остаются внутри импорта.
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelTypeList"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  #--------------------------------------------------------------------------
  /api/v1/fuel-prices/observations/{observationId}:
    get:
      tags:
        - Fuel prices
      operationId: getFuelPriceObservation
      summary: Get observation provenance
      description: Вызывается при открытии подробностей конкретной цены. observationId идентифицирует неизменяемую версию наблюдения; исправление
        цены создаёт новый ID. Полный ответ не требует сохранённой строки графика или справочника.
      parameters:
        - name: observationId
          in: path
          description: ID доступной цены из ответа страницы или расчёта.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceObservationResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  ###########################################################################
  # Refueling
  ###########################################################################
  /api/v1/refueling/calculate:
    post:
      tags:
        - Refueling
      operationId: calculateRefueling
      summary: Calculate refueling costs
      description: "Рассчитывает стоимость объёма по OFFICIAL и MARKET в одной транзакции чтения. Вход: регионы, топливо, дата и объём. Для
        каждого источника используется последняя общая дата не позже запрошенной. Отсутствующий источник не блокирует второй результат."
      requestBody:
        description: Полный выбор и объём для расчёта.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefuelingCalculateRequest"
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefuelingCalculation"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/fuel-prices:
    get:
      tags:
        - Fuel prices
      operationId: getFuelPricePage
      summary: Get both price sources
      description: Сводка, история и сравнение OFFICIAL и MARKET в одном согласованном чтении. Контекст и состояния источников возвращаются один
        раз. Отсутствие наблюдений одного источника не скрывает другой.
      parameters:
        - $ref: "#/components/parameters/BaseRegionCode"
        - $ref: "#/components/parameters/FilterRegionCode"
        - $ref: "#/components/parameters/FilterFuelType"
        - $ref: "#/components/parameters/FilterDateFrom"
        - $ref: "#/components/parameters/FilterDateTo"
        - name: sortSource
          in: query
          schema:
            $ref: "#/components/schemas/PriceSource"
          description: Источник, по которому упорядочиваются регионы; по умолчанию OFFICIAL.
        - name: sortBy
          in: query
          schema:
            $ref: "#/components/schemas/ComparisonSortBy"
        - name: sortOrder
          in: query
          schema:
            $ref: "#/components/schemas/SortOrder"
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricePage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    BaseRegionCode:
      name: baseRegionCode
      in: query
      description: Точный data[].okatoCode из GET /api/v1/regions для основного региона; входит в filterRegionCode.
      required: true
      schema:
        $ref: '#/components/schemas/RegionCode'

    FilterRegionCode:
      name: filterRegionCode
      in: query
      description: От 1 до 4 точных data[].okatoCode из GET /api/v1/regions, включая основной. Один CSV-параметр с разделителем-запятой, без
        пробелов, кавычек и JSON-скобок. Повтор ключа, пустой список, пустые элементы и дубликаты недопустимы.
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RegionCode'
        minItems: 1
        maxItems: 4
        uniqueItems: true

    FilterFuelType:
      name: filterFuelType
      in: query
      description: Один вид топлива.
      required: true
      schema:
        $ref: '#/components/schemas/FuelType'

    FilterDateFrom:
      name: filterDateFrom
      in: query
      description: Включительная нижняя граница диапазона дней в формате YYYY-MM-DD; не позже filterDateTo.
        Недельные наблюдения включаются при пересечении их семидневного периода с диапазоном; referenceDate может быть раньше на 6 дней.
      required: true
      schema:
        type: string
        format: date

    FilterDateTo:
      name: filterDateTo
      in: query
      description: Включительная верхняя граница диапазона дней в формате YYYY-MM-DD, не раньше filterDateFrom и не позже meta.serverDate плюс
        один календарный год (Europe/Moscow). Будущие цены вычисляются при запросе по официальным историческим аналогам за 1–3 года.
      required: true
      schema:
        type: string
        format: date

    Frequency:
      name: frequency
      in: query
      description: |-
        Частота итоговых наблюдений: дни, недели или месяцы. BenzUp: среднее замеров региона за день; завершённые недели и месяцы — среднее доступных дневных значений с равным весом дней.
      required: true
      schema:
        $ref: '#/components/schemas/Frequency'

    Source:
      name: source
      in: query
      description: Источник цен. OFFICIAL поддерживает WEEKLY; MARKET поддерживает DAILY. Внешние API при чтении не вызываются.
      required: true
      schema:
        $ref: "#/components/schemas/PriceSource"

  headers:
    NoStore:
      description: Ответ не требует HTTP-кеша клиента.
      schema:
        type: string
        enum:
          - no-store

  responses:
    InvalidInput:
      description: Некорректные поля, коды справочников, даты, объём или состав выбора.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ResourceNotFound:
      description: Наблюдение с таким observationId не найдено.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Не удалось обработать запрос.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Собственный сервис или его архив недоступен; отказ внешнего источника при доступном архиве не является этой ошибкой.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ###########################################################################
    # Common Data Structures
    ###########################################################################
    SortOrder:
      type: string
      enum:
        - ASC
        - DESC

    DataVersion:
      description: Информационная ревизия архива на момент согласованного чтения.
      type: string
      minLength: 1
      maxLength: 128

    DecimalString:
      description: Неотрицательное десятичное значение без потери исходной точности.
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
      example: "72.50"

    NullableDecimalString:
      description: null означает отсутствие значения; это не нулевая цена.
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
      nullable: true

    NullableSignedDecimalString:
      description: Разница цен с исходной точностью; null, если сравнение невозможно.
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 66
      nullable: true

    Money:
      description: Неотрицательная сумма в рублях, ровно два знака после точки.
      type: string
      pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
      example: "43500.00"

    SignedMoney:
      description: Разница округлённых сумм в рублях; отрицательное значение означает меньшую стоимость.
      type: string
      pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{2}$
      example: "-420.00"

    NullablePercent:
      description: Проценты с двумя знаками после точки; null при отсутствии базы.
      type: string
      pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{2}$
      nullable: true
      example: "1.68"

    VolumeLiters:
      description: Положительный объём от 0.01 до 1000000.00 л включительно; максимум два знака после точки. Проверка диапазона обязательна на сервере.
      type: string
      pattern: ^(0|[1-9][0-9]{0,6})(\.[0-9]{1,2})?$
      maxLength: 10
      example: "600"

    ApiMeta:
      description: Метаданные ответа. serverDate — текущая календарная дата Europe/Moscow; generatedAt — RFC 3339 с часовым поясом.
      required:
        - requestId
        - generatedAt
        - serverDate
        - dataVersion
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        generatedAt:
          type: string
          format: date-time
        serverDate:
          type: string
          format: date
        dataVersion:
          $ref: "#/components/schemas/DataVersion"

    ###########################################################################
    # Reference Data
    ###########################################################################
    RegionCode:
      description: Точное строковое значение data[].okatoCode из GET /api/v1/regions. Не название региона, не короткий территориальный код и не
        код канала загрузки. Код сохраняется целиком, включая ведущие нули; существование проверяется по справочнику БД.
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[A-Z0-9][A-Z0-9_-]*$

    FuelType:
      type: string
      enum:
        - DIESEL
        - AI_92
        - AI_95

    RegionRef:
      description: Территория из полного ОКАТО Витрины, включённая в официальную выборку «Россия + ФО + регионы без городов».
      required:
        - okatoCode
        - name
      type: object
      properties:
        okatoCode:
          $ref: "#/components/schemas/RegionCode"
        name:
          type: string
          minLength: 1

    FuelTypeRef:
      description: Вид топлива и его код в справочнике товаров Витрины Росстата.
      required:
        - code
        - name
      type: object
      properties:
        code:
          $ref: "#/components/schemas/FuelType"
        name:
          type: string

    RegionList:
      description: Полный список субъектов РФ по названию, затем по коду; поиск по названию выполняется в UI.
      required:
        - meta
        - data
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/ApiMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegionRef"

    FuelTypeList:
      description: Поддерживаемые виды топлива в порядке DIESEL, AI_92, AI_95.
      required:
        - meta
        - data
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/ApiMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/FuelTypeRef"

    ###########################################################################
    # Sources
    ###########################################################################
    PriceSource:
      description: "OFFICIAL — недельные официальные цены: Витрина Росстата, при недоступности — rustata. MARKET — дневные региональные индексы
        BenzUp. Источники не подменяют друг друга."
      type: string
      enum:
        - OFFICIAL
        - MARKET

    SourceRef:
      description: Фактический поставщик наблюдения. Для OFFICIAL — ROSSTAT или RUSTATA, для MARKET — BENZUP.
      required:
        - code
        - name
        - url
      type: object
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          nullable: true

    SourceUpdate:
      required:
        - source
        - frequency
        - status
        - lastSuccessAt
      type: object
      properties:
        source:
          $ref: "#/components/schemas/PriceSource"
        frequency:
          $ref: "#/components/schemas/Frequency"
        status:
          type: string
          enum:
            - READY
            - UNAVAILABLE
            - UNKNOWN
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true

    SourceUpdates:
      description: Состояние загрузки выбранной периодичности. Ключи — OFFICIAL или MARKET. Ошибка загрузки не удаляет сохранённые цены.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/SourceUpdate"

    ###########################################################################
    # Fuel Prices
    ###########################################################################
    Frequency:
      description: Наблюдения OFFICIAL — WEEKLY, MARKET — DAILY. Прогнозы обоих источников — WEEKLY.
      type: string
      enum:
        - DAILY
        - WEEKLY

    ComparisonSortBy:
      type: string
      enum:
        - PRICE
        - REGION_NAME

    PricePeriod:
      description: Единый период региональных наблюдений всех трёх каналов. Фильтрация идёт по referenceDate. Границы недельного периода
        неизвестного охвата равны null.
      required:
        - key
        - frequency
        - referenceDate
      type: object
      properties:
        key:
          type: string
          minLength: 1
        frequency:
          $ref: "#/components/schemas/Frequency"
        referenceDate:
          type: string
          format: date

    MissingPriceReason:
      type: string
      enum:
        - NO_DATA_IN_RANGE
        - NO_OBSERVATION_FOR_PERIOD
        - INSUFFICIENT_HISTORY

    ForecastBasis:
      description: Прогноз по среднему относительному изменению официальных цен за сопоставимые периоды 1–3 лет назад.
        Один коэффициент применяется к отдельным последним фактическим ценам OFFICIAL и MARKET. Вычисляется без сохранения.
        historicalYears содержит годы начала аналогов; состав доступных аналогов может различаться между неделями.
      type: object
      required:
        - asOfDate
        - baseDate
        - basePriceRubPerLiter
        - historicalYears
        - growthPercent
        - historySource
        - method
      properties:
        asOfDate:
          type: string
          format: date
        baseDate:
          type: string
          format: date
        basePriceRubPerLiter:
          $ref: "#/components/schemas/DecimalString"
        historicalYears:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
        growthPercent:
          type: string
        historySource:
          type: string
          enum: [OFFICIAL]
        method:
          type: string
          enum: [HISTORICAL_RELATIVE_CHANGE]
      additionalProperties: false

    AvailablePriceCell:
      description: Доступная цена с кратким происхождением; missingReason всегда null. Состояние потока находится в sourceUpdates, последняя
        доступная дата — на уровне ряда, строки или сводки. У наблюдения observationId заполнен, forecast отсутствует;
        у прогноза observationId равен null, forecast обязателен, периодичность WEEKLY.
      required:
        - priceRubPerLiter
        - observationId
        - period
        - source
        - missingReason
      type: object
      properties:
        priceRubPerLiter:
          $ref: "#/components/schemas/DecimalString"
        observationId:
          type: string
          nullable: true
          minLength: 1
        period:
          $ref: "#/components/schemas/PricePeriod"
        source:
          $ref: "#/components/schemas/PriceSource"
        forecast:
          $ref: "#/components/schemas/ForecastBasis"
        missingReason:
          type: string
          nullable: true
          enum:
            - null
      additionalProperties: false

    MissingPriceCell:
      description: Явный пропуск с обязательной причиной. Цена и ID всегда null, источник отсутствует. Период присутствует у пропущенной точки
        календаря.
      required:
        - priceRubPerLiter
        - observationId
        - missingReason
      type: object
      properties:
        priceRubPerLiter:
          type: string
          nullable: true
          enum:
            - null
        observationId:
          type: string
          nullable: true
          enum:
            - null
        period:
          $ref: "#/components/schemas/PricePeriod"
        missingReason:
          $ref: "#/components/schemas/MissingPriceReason"
      additionalProperties: false

    PriceCell:
      description: Доступная цена или явный пропуск; варианты имеют разные обязательные поля.
      oneOf:
        - $ref: "#/components/schemas/AvailablePriceCell"
        - $ref: "#/components/schemas/MissingPriceCell"
      example:
        priceRubPerLiter: null
        observationId: null
        missingReason: NO_DATA_IN_RANGE

    PriceChange:
      description: Изменение от startPrice до latestPrice той же сводки. Конечная цена отдельно не дублируется. При одной/нуле точек разницы null;
        при двух и нулевой начальной цене абсолютная разница задана, percent=null.
      required:
        - status
        - startPrice
        - absoluteRubPerLiter
        - percent
      type: object
      properties:
        status:
          type: string
          enum:
            - AVAILABLE
            - INSUFFICIENT_DATA
            - ZERO_BASE
        startPrice:
          $ref: "#/components/schemas/PriceCell"
        absoluteRubPerLiter:
          $ref: "#/components/schemas/NullableSignedDecimalString"
        percent:
          $ref: "#/components/schemas/NullablePercent"
      additionalProperties: false

    ComparisonStatus:
      type: string
      enum:
        - AVAILABLE
        - SINGLE_REGION
        - NO_COMMON_PERIOD
        - NO_DATA

    ComparisonSummary:
      description: Данные карточки минимальной цены за общий срез. lowestDifferenceRubPerLiter = минимум минус цена основного региона. Для
        SINGLE_REGION нет минимума или разницы; UI предлагает добавить регионы.
      required:
        - status
        - lowestPriceRubPerLiter
        - lowestRegions
        - hasNewerObservations
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ComparisonStatus"
        period:
          $ref: "#/components/schemas/PricePeriod"
        lowestPriceRubPerLiter:
          $ref: "#/components/schemas/NullableDecimalString"
        lowestRegions:
          type: array
          items:
            $ref: "#/components/schemas/RegionRef"
          maxItems: 4
        hasNewerObservations:
          type: boolean

    PriceOverview:
      description: Самодостаточная сводка; latestPrice и change относятся к основному региону, comparison — к общему периоду выбранных регионов.
      required:
        - latestPrice
        - latestAvailableDate
        - change
        - comparison
      type: object
      properties:
        latestPrice:
          $ref: "#/components/schemas/PriceCell"
        latestAvailableDate:
          type: string
          format: date
          nullable: true
        change:
          $ref: "#/components/schemas/PriceChange"
        comparison:
          $ref: "#/components/schemas/ComparisonSummary"

    RegionPriceSeries:
      description: Сохранённые наблюдения по общему календарю источника. Недельная цена действует семь календарных дней от date.
        Включаются недельные наблюдения, пересекающие выбранный диапазон; дневные наблюдения ограничены диапазоном строго.
      required:
        - region
        - status
        - points
      type: object
      properties:
        region:
          $ref: "#/components/schemas/RegionRef"
        status:
          type: string
          enum:
            - AVAILABLE
            - PARTIAL
            - NO_DATA
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"

    ComparisonRow:
      description: При сопоставимости price относится к общему периоду; иначе к последнему индивидуальному наблюдению внутри диапазона, разница
        null и обе метки false. У основного региона разница null.
      required:
        - region
        - isBase
        - price
        - latestAvailableDate
        - differenceRubPerLiter
        - isLowest
      type: object
      properties:
        region:
          $ref: "#/components/schemas/RegionRef"
        isBase:
          type: boolean
        price:
          $ref: "#/components/schemas/PriceCell"
        latestAvailableDate:
          type: string
          format: date
          nullable: true
        differenceRubPerLiter:
          $ref: "#/components/schemas/NullableSignedDecimalString"
        isLowest:
          type: boolean

    ComparisonInfo:
      description: Ответ содержит актуальные данные одного согласованного чтения.
      required:
        - status
        - sortBy
        - sortOrder
        - allPricesEqual
        - hasNewerObservations
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ComparisonStatus"
        period:
          $ref: "#/components/schemas/PricePeriod"
        sortBy:
          $ref: "#/components/schemas/ComparisonSortBy"
        sortOrder:
          $ref: "#/components/schemas/SortOrder"
        allPricesEqual:
          type: boolean
          nullable: true
        hasNewerObservations:
          type: boolean

    Comparison:
      description: Сведения о срезе и строки регионального сравнения. Объяснение и доступные действия UI выбирает по status.
      allOf:
        - $ref: "#/components/schemas/ComparisonInfo"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ComparisonRow"
              minItems: 1
              maxItems: 4

    PriceObservation:
      description: "Цена и фактический поставщик: ROSSTAT, RUSTATA или BENZUP. publicationDate — дата публикации, если поставщик её сообщает;
        loadedAt — время загрузки."
      required:
        - region
        - fuelType
        - price
        - latestAvailableDate
        - provider
        - publicationDate
        - loadedAt
      type: object
      properties:
        region:
          $ref: "#/components/schemas/RegionRef"
        fuelType:
          $ref: "#/components/schemas/FuelTypeRef"
        price:
          $ref: "#/components/schemas/AvailablePriceCell"
        latestAvailableDate:
          type: string
          format: date
          nullable: true
        publicationDate:
          type: string
          format: date
          nullable: true
        loadedAt:
          type: string
          format: date-time
        provider:
          $ref: "#/components/schemas/SourceRef"
      additionalProperties: false

    PriceObservationResponse:
      description: Детали наблюдения не требуют ранее загруженного контекста страницы.
      required:
        - meta
        - observation
        - sourceUpdates
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/ApiMeta"
        observation:
          $ref: "#/components/schemas/PriceObservation"
        sourceUpdates:
          $ref: "#/components/schemas/SourceUpdates"

    ###########################################################################
    # Refueling
    ###########################################################################
    RefuelingSelection:
      description: Регионы, топливо и дата для обоих расчётов. Историческая дата использует последнюю общую цену не позднее date.
        Будущая дата использует прогноз соответствующей недели для обоих источников. Максимум serverDate плюс один календарный год.
      required:
        - baseRegionCode
        - regionCodes
        - fuelType
        - date
      type: object
      properties:
        baseRegionCode:
          $ref: "#/components/schemas/RegionCode"
        regionCodes:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RegionCode"
        fuelType:
          $ref: "#/components/schemas/FuelType"
        date:
          type: string
          format: date
      additionalProperties: false

    RefuelingCalculateRequest:
      description: Общий выбор и объём для двух расчётов. Ожидаемые ID срезов необязательны; неизвестные источники, null и пустые ID не допускаются.
      required:
        - selection
        - volumeLiters
      type: object
      properties:
        selection:
          $ref: "#/components/schemas/RefuelingSelection"
        volumeLiters:
          $ref: "#/components/schemas/VolumeLiters"
      additionalProperties: false
      example:
        selection:
          baseRegionCode: REGION_FROM_CATALOG
          regionCodes:
            - REGION_FROM_CATALOG
          fuelType: DIESEL
          date: 2026-10-25
        volumeLiters: "600"

    RefuelingRow:
      description: Единая строка сравнения и стоимости. totalRub=HALF_UP(volume × точная цена, 2); differenceRub=округлённый итог минус
        округлённый итог основного региона. Для базового differenceRub=0.00, differenceRubPerLiter=null и relation=BASE. Другие метки и
        разница цены имеют тот же смысл, что в ComparisonRow.
      required:
        - region
        - price
        - totalRub
        - differenceRub
        - relation
      type: object
      properties:
        region:
          $ref: "#/components/schemas/RegionRef"
        price:
          $ref: "#/components/schemas/AvailablePriceCell"
        totalRub:
          $ref: "#/components/schemas/Money"
        differenceRub:
          $ref: "#/components/schemas/SignedMoney"
        relation:
          type: string
          enum:
            - BASE
            - LOWER
            - HIGHER
            - EQUAL
      additionalProperties: false

    RefuelingComparison:
      description: Тот же срез и единый массив строк сравнения с денежными результатами. Для основного региона relation=BASE заменяет isBase.
        Строки содержат все цены, разницы и метки для синхронизации таблицы сравнения с расчётом.
      allOf:
        - $ref: "#/components/schemas/ComparisonInfo"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RefuelingRow"
              minItems: 1
              maxItems: 4

    RefuelingSourceCalculation:
      description: Независимый результат одного источника. При отсутствии сопоставимых наблюдений baseTotalRub и comparison равны null.
      required:
        - status
        - baseTotalRub
        - comparison
        - source
        - frequency
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ComparisonStatus"
        baseTotalRub:
          type: string
          nullable: true
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
        comparison:
          type: object
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/RefuelingComparison"
            - type: object
              nullable: true
              enum:
                - null
        source:
          $ref: "#/components/schemas/PriceSource"
        frequency:
          $ref: "#/components/schemas/Frequency"
      additionalProperties: false

    RefuelingCalculation:
      description: Два расчёта из одной ревизии архива. results всегда содержит OFFICIAL первым и MARKET вторым; даты и доступность независимы.
      required:
        - meta
        - volumeLiters
        - currency
        - results
        - sourceUpdates
        - context
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/ApiMeta"
        volumeLiters:
          $ref: "#/components/schemas/VolumeLiters"
        currency:
          type: string
          enum:
            - RUB
        results:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/RefuelingSourceCalculation"
        sourceUpdates:
          $ref: "#/components/schemas/SourceUpdates"
        context:
          $ref: "#/components/schemas/PricePageContext"
      additionalProperties: false

    ###########################################################################
    # Errors
    ###########################################################################
    ErrorDetail:
      description: Ошибка поля или смысловая причина отказа. field=null для ошибки всего запроса.
      required:
        - field
        - code
        - message
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1

    ErrorResponse:
      description: Единая ошибка в стиле astoc-core. Нет трассировок стека или технических секретов.
      required:
        - type
        - message
        - timestamp
        - requestId
        - details
      type: object
      properties:
        type:
          type: string
          enum:
            - InvalidInput
            - ResourceNotFound
            - InternalError
            - ServiceUnavailable
        message:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      example:
        type: InvalidInput
        message: Объём должен быть больше нуля.
        timestamp: 2026-10-26T09:00:00Z
        requestId: request-example
        details:
          - field: volumeLiters
            code: OUT_OF_RANGE
            message: Допустимо от 0.01 до 1000000.00 л.
    TrendPoint:
      description: Исходная дата сохранённого наблюдения. Для недельной цены это начало семидневного периода;
        дата может предшествовать началу выбранного диапазона до 6 дней. Отсутствующая цена не заменяется нулём.
      type: object
      required:
        - kind
        - date
        - priceRubPerLiter
        - observationId
        - missingReason
      properties:
        kind:
          description: OBSERVED — исходное наблюдение; FORECAST — недельный прогноз, observationId всегда null.
          type: string
          enum: [OBSERVED, FORECAST]
          default: OBSERVED
        forecast:
          $ref: "#/components/schemas/ForecastBasis"
        date:
          type: string
          format: date
        priceRubPerLiter:
          $ref: "#/components/schemas/NullableDecimalString"
        observationId:
          type: string
          nullable: true
        missingReason:
          type: string
          nullable: true
          enum:
            - NO_DATA_IN_RANGE
            - NO_OBSERVATION_FOR_PERIOD
            - INSUFFICIENT_HISTORY
            - null
    PricePageContext:
      description: Общий выбор регионов, топлива и дат для обоих источников.
      required:
        - baseRegion
        - regions
        - fuelType
        - dateFrom
        - dateTo
      type: object
      properties:
        baseRegion:
          $ref: "#/components/schemas/RegionRef"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionRef"
          minItems: 1
          maxItems: 4
        fuelType:
          $ref: "#/components/schemas/FuelTypeRef"
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
    PriceSourcePage:
      description: frequency описывает сохранённые наблюдения источника. Прогнозные точки обоих источников всегда недельные,
        помечены kind=FORECAST и рассчитаны при запросе. Сводка и сравнение для будущего диапазона относятся к его последней неделе.
      type: object
      required:
        - frequency
        - overview
        - trend
        - comparison
      properties:
        frequency:
          $ref: "#/components/schemas/Frequency"
        overview:
          $ref: "#/components/schemas/PriceOverview"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/RegionPriceSeries"
        comparison:
          $ref: "#/components/schemas/Comparison"
    PricePage:
      type: object
      required:
        - meta
        - context
        - sources
        - sourceUpdates
        - comparisonOrder
      properties:
        meta:
          $ref: "#/components/schemas/ApiMeta"
        context:
          $ref: "#/components/schemas/PricePageContext"
        sources:
          type: object
          required:
            - OFFICIAL
            - MARKET
          properties:
            OFFICIAL:
              $ref: "#/components/schemas/PriceSourcePage"
            MARKET:
              $ref: "#/components/schemas/PriceSourcePage"
        sourceUpdates:
          $ref: "#/components/schemas/SourceUpdates"
        comparisonOrder:
          $ref: "#/components/schemas/PriceSource"
