spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fuel-calc
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:fuel_calc}
    username: ${POSTGRES_USER:fuel_calc}
    password: ${POSTGRES_PASSWORD:}
  liquibase:
    change-log: classpath:/db/changelog/master.xml
    database-change-log-table: db_migration_log
    database-change-log-lock-table: db_migration_lock
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health


imports:
  enabled: ${IMPORTS_ENABLED:true}
  fetch-on-startup: ${FETCH_ON_STARTUP:true}
  time-zone: ${IMPORTS_TIME_ZONE:Europe/Moscow}
  connect-timeout: ${SOURCE_CONNECT_TIMEOUT:PT10S}
  request-timeout: PT30S
  max-response-bytes: 33554432
  max-run-duration: PT30M
  regions:
    okato-endpoint: ${OKATO_ENDPOINT:https://showdata.rosstat.gov.ru/backbone/set/13032}
    selection-endpoint: ${REGION_SELECTION_ENDPOINT:https://showdata.rosstat.gov.ru/backbone/set/304297}
    cron: "${REGION_CATALOG_CRON:0 0 3 * * MON}"
  rosstat:
    base-url: ${ROSSTAT_BASE_URL:https://showdata.rosstat.gov.ru}
    indicator-id: 274422
    goods-set-id: 108929
    start-date: ${ROSSTAT_START_DATE:2026-01-01}
    cron: "${ROSSTAT_CRON:0 0 0 * * *}"
    ignore-tls-errors: ${ROSSTAT_IGNORE_TLS_ERRORS:true}
    request-timeout: PT2M
  rustata:
    base-url: ${RUSTATA_BASE_URL:https://rustata.ru}
    dataset: fedstat/indicator_37426
    start-date: ${RUSTATA_START_DATE:2026-01-01}
    token: ${RUSTATA_TOKEN:}
    request-interval: PT6S
    page-size: 300
    max-pages: 20
  benzup:
    cron: "${BENZUP_CRON:0 0 12 * * *}"
    endpoint: ${BENZUP_ENDPOINT:https://api.omt-consult.ru/index/regional}
    token: ${BENZUP_TOKEN:}
